<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arke Keep</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="home">
      <section class="home-panel">
        <p class="brand">Arke Keep</p>
        <h2>Sistema de créditos e entregas</h2>
        <p class="muted" style="margin-top: 10px; max-width: 620px;">
          Preview navegável com ambientes separados para Admin, Cliente e Time.
        </p>
        <div class="role-grid">
          <a href="./admin.html">
            <div>
              <h3>Admin</h3>
              <p class="muted">Gestão de clientes, créditos e novas tarefas.</p>
            </div>
            <span class="badge darkgreen">Entrar</span>
          </a>
          <a href="./cliente.html">
            <div>
              <h3>Cliente</h3>
              <p class="muted">Saldo, entregas e histórico do próprio plano.</p>
            </div>
            <span class="badge blue">Entrar</span>
          </a>
          <a href="./time.html">
            <div>
              <h3>Time</h3>
              <p class="muted">Kanban das tarefas atribuídas ao membro.</p>
            </div>
            <span class="badge warn">Entrar</span>
          </a>
        </div>
      </section>
    </main>
